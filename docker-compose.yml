# docker-compose.yml
version: '3'
networks:
  todoapp-net: 
    driver: bridge
    name: app-net-1.0.0
services:
  pythonapp:
    image: todoapp:2.0.0
    container_name: app-1.0.1
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - todoapp-net
    depends_on:
      - mysql
    restart: unless-stopped
  mysql:
    image: mysql:latest
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: my-sql-1.0.1
    ports:
      - "3306:3306"
    volumes:
      - todoapp-db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_ENGINE=mysql.connector.django
      - MYSQL_HOST=localhost
      - MYSQL_PORT=3306
    networks:
      - todoapp-net
volumes:
  todoapp-db-data:
